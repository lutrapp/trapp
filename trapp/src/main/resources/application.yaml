# Configurações gerais do aplicativo
spring:
  application:
    name: ${APP_NAME:trapp}
  profiles:
    active: ${SPRING_ACTIVE_PROFILE:local}
  banner:
    location: banner.txt

# Configurações do servidor embutido
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /trapp/v1

# Configurações do logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}

management:
  metrics:
    tags:
      application: trapp
  endpoints:
    web:
      exposure:
        include: health, info
